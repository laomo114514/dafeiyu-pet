<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { position: fixed !important; top: 0 !important; left: 0 !important; }
</style>
</head>
<body>
<script>
function loadScript(src) {
  return new Promise(function (res) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { res(); };
    s.onerror = function () { res(); };
    document.head.appendChild(s);
  });
}

var app, model, groups = [];

(async function () {
  var params = new URLSearchParams(location.search);
  var modelPath = params.get('model') || '';

  await loadScript('/assets/pixi.min.js');
  await loadScript('/assets/live2dcubismcore.min.js');
  await loadScript('/assets/cubism4.min.js');
  if (typeof PIXI === 'undefined' || !PIXI.live2d) return;

  try {
    app = new PIXI.Application({ transparent: true, antialias: true, resizeTo: window });
    document.body.appendChild(app.view);

    model = await PIXI.live2d.Live2DModel.from('/model/' + encodeURI(modelPath), { autoInteract: false });
    app.stage.addChild(model);
    model.autoUpdate = false;

    var b = model.getLocalBounds();
    var scale = Math.min(app.screen.width / b.width, app.screen.height / b.height) * 0.98;
    model.scale.set(scale);
    model.x = (app.screen.width - b.width * scale) / 2 - b.x * scale;
    model.y = (app.screen.height - b.height * scale) / 2 - b.y * scale;
    model.anchor.set(0, 0);

    var sj = model.internalModel.settings.json || {};
    var mg = sj.Motions || {};
    var motions = {};
    Object.keys(mg).forEach(function (k) {
      motions[k] = mg[k].map(function (m) {
        return { File: m.File, FadeInTime: 0.5, FadeOutTime: 0.5 };
      });
    });

    var mgr = model.internalModel.motionManager;
    mgr.definitions = motions;
    groups = Object.keys(motions);

    if (groups.length > 0) {
      var g0 = groups.indexOf('Idle') >= 0 ? 'Idle' : groups[0];
      try { mgr.startMotion(g0, 0, 1); } catch (e) {}
    }

    var last = performance.now();
    setInterval(function () {
      var now = performance.now();
      var dt = Math.min(now - last, 100);
      last = now;
      try { model.update(dt); } catch (e) {}
      try { app.renderer.render(app.stage); } catch (e) {}
    }, 33);
  } catch (e) {
  }
})();

function tapOnce() {
  try {
    if (!model) return;
    var mgr = model.internalModel.motionManager;
    var g = groups.indexOf('TapBody') >= 0 ? 'TapBody' : groups[0];
    if (g) mgr.startMotion(g, 0, 1);
    try { model.expression(); } catch (e) {}
    if (window.AndroidQ) window.AndroidQ.bounceFromJs();
  } catch (e) {}
}

window.hitTap = function (x, y) {
  try {
    if (!app || !model) return;
    var w = app.renderer.width;
    var h = app.renderer.height;
    if (x < 0 || y < 0 || x >= w || y >= h) return;

    var pixels = app.renderer.plugins.extract.pixels(app.stage);
    var idx = (y * w + x) * 4 + 3;
    if (pixels[idx] > 20) {
      tapOnce();
    }
  } catch (e) {
  }
};
</script>
</body>
</html>
