<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { position: fixed !important; top: 0 !important; left: 0 !important; }
  #dbg { position: absolute; top: 0; left: 0; z-index: 99; background: rgba(0,0,0,.78); color: #6f6; font: 10px monospace; padding: 4px; max-width: 100%; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<div id="dbg">start</div>
<script>
var dbgEl = document.getElementById('dbg');
function dbg(m) { dbgEl.textContent += '\n' + m; }
window.onerror = function (m, s, l) { dbg('ERR ' + m + ' @' + l); };

function loadScript(src) {
  return new Promise(function (res) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { res(); };
    s.onerror = function () { dbg('FAIL ' + src); res(); };
    document.head.appendChild(s);
  });
}

(async function () {
  var params = new URLSearchParams(location.search);
  var modelPath = params.get('model') || '';
  var dir = modelPath.indexOf('/') >= 0 ? modelPath.substring(0, modelPath.lastIndexOf('/') + 1) : '';

  await loadScript('/assets/pixi.min.js');
  await loadScript('/assets/live2dcubismcore.min.js');
  await loadScript('/assets/cubism4.min.js');
  if (typeof PIXI === 'undefined' || !PIXI.live2d) { dbg('no PIXI'); return; }

  try {
    var app = new PIXI.Application({ transparent: true, antialias: true, resizeTo: window });
    document.body.appendChild(app.view);

    var model = await PIXI.live2d.Live2DModel.from('/model/' + encodeURI(modelPath), { autoInteract: false });
    app.stage.addChild(model);
    model.autoUpdate = false;

    var b = model.getLocalBounds();
    var scale = Math.min(app.screen.width / b.width, app.screen.height / b.height) * 0.98;
    model.scale.set(scale);
    model.x = (app.screen.width - b.width * scale) / 2 - b.x * scale;
    model.y = (app.screen.height - b.height * scale) / 2 - b.y * scale;
    model.anchor.set(0, 0);

    app.renderer.render(app.stage);

    var sj = model.internalModel.settings.json || {};
    var motions = {};
    var mg = sj.Motions || {};
    Object.keys(mg).forEach(function (k) {
      motions[k] = mg[k].map(function (m) {
        return {
          File: m.File,
          FadeInTime: m.FadeInTime !== undefined ? m.FadeInTime : 0.5,
          FadeOutTime: m.FadeOutTime !== undefined ? m.FadeOutTime : 0.5
        };
      });
    });

    var mgr = model.internalModel.motionManager;
    mgr.definitions = motions;
    var groups = Object.keys(motions);
    dbg('groups=' + groups.join(','));

    if (groups.length > 0) {
      var g0 = groups.indexOf('Idle') >= 0 ? 'Idle' : groups[0];
      try { mgr.startMotion(g0, 0, 1); dbg('start ' + g0); } catch (e) { dbg('start err ' + e); }
    }

    var last = performance.now();
    var frames = 0;
    var loop = setInterval(function () {
      var now = performance.now();
      var dt = (now - last) / 1000;
      last = now;
      if (dt > 0.1) dt = 0.1;

      try {
        var core = model.internalModel.coreModel;
        var t = now / 1000;
        core.setParameterValueById('ParamBreath', (Math.sin(t * 2) + 1) / 2);
      } catch (e) {}

      try { model.update(dt); } catch (e) {}
      try { app.renderer.render(app.stage); } catch (e) {}
      frames++;
    }, 33);

    setTimeout(function () { dbg('frames=' + frames); }, 3000);

    window.tapPet = function () {
      try {
        var g = groups.indexOf('TapBody') >= 0 ? 'TapBody' : groups[0];
        if (g) { mgr.startMotion(g, 0, 1); dbg('tap -> ' + g); }
      } catch (e) { dbg('tap err ' + e); }
    };
  } catch (e) {
    dbg('load err ' + e);
  }
})();
</script>
</body>
</html>
