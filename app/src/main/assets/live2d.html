<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { position: fixed !important; top: 0 !important; left: 0 !important; }
</style>
</head>
<body>
<script>
function loadScript(src) {
  return new Promise(function (res) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { res(); };
    s.onerror = function () { res(); };
    document.head.appendChild(s);
  });
}

(async function () {
  var params = new URLSearchParams(location.search);
  var modelPath = params.get('model') || '';

  await loadScript('/assets/pixi.min.js');
  await loadScript('/assets/live2dcubismcore.min.js');
  await loadScript('/assets/cubism4.min.js');

  if (typeof PIXI === 'undefined' || !PIXI.live2d) return;

  try {
    var app = new PIXI.Application({
      transparent: true,
      antialias: true,
      resizeTo: window
    });
    document.body.appendChild(app.view);

    var model = await PIXI.live2d.Live2DModel.from(
      '/model/' + encodeURI(modelPath),
      { autoInteract: false }
    );

    app.stage.addChild(model);

    var b = model.getLocalBounds();
    var baseScale = Math.min(
      app.screen.width / b.width,
      app.screen.height / b.height
    ) * 0.98;

    model.scale.set(baseScale);
    model.x = (app.screen.width - b.width * baseScale) / 2 - b.x * baseScale;
    model.y = (app.screen.height - b.height * baseScale) / 2 - b.y * baseScale;
    model.anchor.set(0, 0);

    var baseX = model.x;
    var baseY = model.y;
    var pulse = 0;

    app.ticker.add(function () {
      var t = performance.now() / 1000;
      var core = model.internalModel.coreModel;

      try {
        core.setParameterValueById('ParamAngleZ', Math.sin(t * 1.0) * 5);
        core.setParameterValueById('ParamAngleY', Math.sin(t * 0.8) * 3);
        core.setParameterValueById('ParamAngleX', Math.sin(t * 0.6) * 4);
        core.setParameterValueById('ParamBodyAngleZ', Math.sin(t * 0.9) * 4);
        core.setParameterValueById('ParamBodyAngleX', Math.sin(t * 0.7) * 2);
        core.setParameterValueById('ParamBreath', (Math.sin(t * 2.2) + 1) / 2);
      } catch (e) {}

      if (pulse > 0) {
        pulse = Math.max(0, pulse - 0.05);
        var k = 1 + Math.sin(pulse * Math.PI) * 0.07;
        model.scale.set(baseScale * k);
      } else {
        model.scale.set(baseScale);
      }

      model.x = baseX;
      model.y = baseY;
    });

    var mgr = model.internalModel.motionManager;
    var defs = mgr.definitions || {};
    var groups = Object.keys(defs);

    if (groups.indexOf('Idle') >= 0) {
      mgr.startRandomMotion('Idle');
    } else if (groups.length > 0) {
      mgr.startRandomMotion(groups[0]);
    }

    window.tapPet = function () {
      pulse = 1;
      try {
        if (defs['TapBody'] && defs['TapBody'].length > 0) {
          model.motion('TapBody');
        } else if (groups.length > 0) {
          model.motion(groups[0]);
        }
        model.expression();
      } catch (e) {}
    };
  } catch (e) {
  }
})();
</script>
</body>
</html>
