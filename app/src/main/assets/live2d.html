<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { position: fixed !important; top: 0 !important; left: 0 !important; }
  #dbg { position: absolute; top: 0; left: 0; z-index: 99; background: rgba(0,0,0,.78); color: #6f6; font: 10px monospace; padding: 4px; max-width: 100%; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<div id="dbg"></div>
<script>
var DEBUG = false;   // ← 想调试就改成 true

var dbgEl = document.getElementById('dbg');
function dbg(m) {
  if (!DEBUG) return;
  dbgEl.style.display = 'block';
  dbgEl.textContent += '\n' + m;
}
window.onerror = function (m, s, l) { dbg('ERR ' + m + ' @' + l); };

function loadScript(src) {
  return new Promise(function (res) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { res(); };
    s.onerror = function () { dbg('FAIL ' + src); res(); };
    document.head.appendChild(s);
  });
}

var app, model, groups = [];
var idleGroup = '';

function playRandom(group) {
  try {
    var mgr = model.internalModel.motionManager;
    var list = (mgr.definitions || {})[group];
    if (!list || list.length === 0) return;
    var idx = Math.floor(Math.random() * list.length);
    model.motion(group, idx, 3);
    dbg('play ' + group + '[' + idx + ']');
  } catch (e) { dbg('play err ' + e); }
}

(async function () {
  var params = new URLSearchParams(location.search);
  var modelPath = params.get('model') || '';

  await loadScript('/assets/pixi.min.js');
  await loadScript('/assets/live2dcubismcore.min.js');
  await loadScript('/assets/cubism4.min.js');
  if (typeof PIXI === 'undefined' || !PIXI.live2d) { dbg('no PIXI'); return; }

  try {
    app = new PIXI.Application({ transparent: true, antialias: true, resizeTo: window });
    document.body.appendChild(app.view);

    model = await PIXI.live2d.Live2DModel.from('/model/' + encodeURI(modelPath), { autoInteract: false });
    app.stage.addChild(model);
    model.autoUpdate = false;

    var b = model.getLocalBounds();
    var scale = Math.min(app.screen.width / b.width, app.screen.height / b.height) * 0.98;
    model.scale.set(scale);
    model.x = (app.screen.width - b.width * scale) / 2 - b.x * scale;
    model.y = (app.screen.height - b.height * scale) / 2 - b.y * scale;
    model.anchor.set(0, 0);

    groups = Object.keys(model.internalModel.motionManager.definitions || {});
    idleGroup = groups.indexOf('Idle') >= 0 ? 'Idle' : groups[0] || '';
    dbg('groups=' + groups.join(','));
    dbg('idle=' + idleGroup);

    if (idleGroup) playRandom(idleGroup);
    setInterval(function () { if (idleGroup) playRandom(idleGroup); }, 25000);

    var last = performance.now();
    setInterval(function () {
      var now = performance.now();
      var dt = Math.min(now - last, 100);
      last = now;
      try { model.update(dt); } catch (e) {}
      try { app.renderer.render(app.stage); } catch (e) {}
    }, 33);

    window.hitTap = function () {
      if (groups.indexOf('TapBody') >= 0) playRandom('TapBody');
      else if (groups.length > 0) playRandom(groups[0]);
      try { model.expression(); } catch (e) {}
      if (window.AndroidQ) window.AndroidQ.bounceFromJs();
    };
  } catch (e) {
    dbg('load err ' + e);
  }
})();
</script>
</body>
</html>
