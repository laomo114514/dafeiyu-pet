<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { position: fixed !important; top: 0 !important; left: 0 !important; }
  #log {
    position: absolute; top: 0; left: 0; z-index: 10;
    padding: 6px; background: rgba(0, 0, 0, 0.55);
    color: #fff; font-size: 11px; font-family: sans-serif;
    line-height: 1.4; word-break: break-all; max-width: 100%;
  }
</style>
</head>
<body>
<div id="log">[1] 页面已加载</div>
<script>
var logEl = document.getElementById('log');
function log(msg) { logEl.innerHTML += '<br>' + msg; }
window.onerror = function (m, s, l) { log('ERR: ' + m + ' @' + l); };

function loadScript(src) {
  return new Promise(function (res) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { res(); };
    s.onerror = function () { log('FAIL ' + src); res(); };
    document.head.appendChild(s);
  });
}

(async function () {
  var params = new URLSearchParams(location.search);
  var modelPath = params.get('model') || '';

  await loadScript('/assets/pixi.min.js');
  await loadScript('/assets/live2dcubismcore.min.js');
  await loadScript('/assets/cubism4.min.js');

  if (typeof PIXI === 'undefined' || !PIXI.live2d) {
    log('[X] 库加载失败');
    return;
  }

  try {
    var app = new PIXI.Application({
      transparent: true,
      antialias: true,
      resizeTo: window
    });
    document.body.appendChild(app.view);
    log('[2] 画布: ' + app.screen.width + ' x ' + app.screen.height);

    var model = await PIXI.live2d.Live2DModel.from(
      '/model/' + encodeURI(modelPath),
      { autoInteract: false }
    );

    var scale = Math.min(
      app.screen.width / model.width,
      app.screen.height / model.height
    ) * 0.95;

    model.anchor.set(0, 0);
    model.scale.set(scale);
    model.x = (app.screen.width - model.width * scale) / 2;
    model.y = (app.screen.height - model.height * scale) / 2;
    app.stage.addChild(model);

    log('[3] 模型: ' + model.width.toFixed(0) + ' x ' + model.height.toFixed(0) +
        ' 缩放: ' + scale.toFixed(4) +
        ' 位置: ' + model.x.toFixed(0) + ',' + model.y.toFixed(0));

    var groups = Object.keys(model.internalModel.motionManager.definitions || {});
    log('[4] 动作组: ' + (groups.length ? groups.join(',') : '无'));

    window.tapPet = function () {
      try {
        if (groups.length > 0) {
          model.motion(groups[Math.floor(Math.random() * groups.length)]);
        }
      } catch (e) {}
    };
  } catch (e) {
    log('[X] 模型加载失败: ' + e);
  }
})();
</script>
</body>
</html>
