<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: rgba(180, 0, 0, 0.55); color: #fff; font-size: 12px; font-family: sans-serif; overflow: hidden; }
  #log { padding: 8px; line-height: 1.5; word-break: break-all; }
</style>
</head>
<body>
<div id="log">[1] 页面已加载</div>
<script>
var logEl = document.getElementById('log');
function log(msg) { logEl.innerHTML += '<br>' + msg; }
window.onerror = function (m, s, l) { log('ERR: ' + m + ' @' + l); };

function loadScript(src) {
  return new Promise(function (res) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { log('OK ' + src); res(); };
    s.onerror = function () { log('FAIL ' + src); res(); };
    document.head.appendChild(s);
  });
}

(async function () {
  var params = new URLSearchParams(location.search);
  var modelPath = params.get('model') || '';
  log('[2] model 参数: ' + (modelPath || '(空)'));

  await loadScript('/assets/pixi.min.js');
  await loadScript('/assets/live2dcubismcore.min.js');
  await loadScript('/assets/cubism4.min.js');

  log('[3] PIXI: ' + (typeof PIXI) + ', PIXI.live2d: ' + (typeof PIXI !== 'undefined' ? typeof PIXI.live2d : 'n/a'));

  if (typeof PIXI === 'undefined' || !PIXI.live2d) {
    log('[X] 库没加载成功，停止');
    return;
  }

  try {
    var app = new PIXI.Application({ transparent: true, antialias: true, resizeTo: window });
    document.body.appendChild(app.view);
    log('[4] PIXI Application 已创建');

    var model = await PIXI.live2d.Live2DModel.from(
      '/model/' + encodeURI(modelPath),
      { autoInteract: false }
    );
    log('[5] 模型已加载: ' + model.width + ' x ' + model.height);

    var scale = Math.min(app.screen.width / model.width, app.screen.height / model.height) * 1.05;
    model.scale.set(scale);
    model.x = (app.screen.width - model.width * scale) / 2;
    model.y = app.screen.height - model.height * scale;
    app.stage.addChild(model);

    var groups = Object.keys(model.internalModel.motionManager.definitions || {});
    log('[6] 动作组: ' + groups.join(', '));
    if (groups.length > 0) {
      model.internalModel.motionManager.startRandomMotion(groups[0]);
    }

    window.tapPet = function () {
      try {
        if (groups.length > 0) {
          model.motion(groups[Math.floor(Math.random() * groups.length)]);
        }
      } catch (e) {}
    };
  } catch (e) {
    log('[X] 模型加载失败: ' + e);
  }
})();
</script>
</body>
</html>
